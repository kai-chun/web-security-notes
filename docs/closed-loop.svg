<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="sans-serif" role="img" aria-label="Closed-loop verification: one exploit, three checks that must agree">
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .cvs  { fill: #24292f; }
    .cvs2 { fill: #57606a; }
    .body { fill: #24292f; }
    .mut  { fill: #57606a; }
    .cardbg { fill: #ffffff; stroke: #d0d7de; }
    .band   { fill: #f6f8fa; stroke: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      .cvs  { fill: #e6edf3; }
      .cvs2 { fill: #8b949e; }
      .body { fill: #adbac7; }
      .mut  { fill: #768390; }
      .cardbg { fill: #1c2128; stroke: #30363d; }
      .band   { fill: #22272e; stroke: #30363d; }
    }
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- title -->
  <text class="cvs"  fill="#6e7781" x="464" y="40" text-anchor="middle" font-size="23" font-weight="700">Closed-loop verification</text>
  <text class="cvs2" fill="#6e7781" x="464" y="64" text-anchor="middle" font-size="13">one exploit &#183; three checks that must agree &#183; red &#8594; blue</text>

  <!-- exploit node -->
  <rect class="cardbg" fill="#ffffff" stroke="#d0d7de" x="334" y="88" width="260" height="84" rx="12"/>
  <circle cx="356" cy="118" r="4" fill="#e5484d"/>
  <text class="cvs2" fill="#6e7781" x="370" y="122" font-size="11" font-weight="700" letter-spacing="0.6">EXPLOIT</text>
  <text class="body mono" fill="#24292f" x="352" y="145" font-size="13">exploits/exploit.py</text>
  <text class="mut" fill="#6e7781" x="352" y="164" font-size="11">one target-agnostic PoC &#183; exit 0 = success</text>

  <!-- fan-out arrows -->
  <path d="M464,174 C464,196 191.5,192 191.5,212" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M464,176 L464.5,212" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M464,174 C464,196 737.5,192 737.5,212" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arw)"/>
  <text class="cvs2" fill="#6e7781" x="612" y="200" text-anchor="middle" font-size="10.5" font-style="italic">the same attack traffic hits every build</text>

  <!-- card A: vulnerable -->
  <rect class="cardbg" fill="#ffffff" stroke="#d0d7de" x="70" y="214" width="243" height="138" rx="12"/>
  <circle cx="104" cy="244" r="4" fill="#e5484d"/>
  <text class="cvs2" fill="#6e7781" x="118" y="248" font-size="11" font-weight="700" letter-spacing="0.6">VULNERABLE BUILD</text>
  <text class="body mono" fill="#24292f" x="100" y="276" font-size="13">vulnerable_app/</text>
  <rect x="100" y="290" width="100" height="25" rx="12" fill="#e5484d"/>
  <text x="150" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">BYPASSED</text>
  <text class="mut" fill="#6e7781" x="100" y="336" font-size="11.5">proves the bug is real</text>

  <!-- card B: secure -->
  <rect class="cardbg" fill="#ffffff" stroke="#d0d7de" x="343" y="214" width="243" height="138" rx="12"/>
  <circle cx="377" cy="244" r="4" fill="#30a46c"/>
  <text class="cvs2" fill="#6e7781" x="391" y="248" font-size="11" font-weight="700" letter-spacing="0.6">SECURE BUILD</text>
  <text class="body mono" fill="#24292f" x="373" y="276" font-size="13">secure_app/</text>
  <rect x="373" y="290" width="88" height="25" rx="12" fill="#30a46c"/>
  <text x="417" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">BLOCKED</text>
  <text class="mut" fill="#6e7781" x="373" y="336" font-size="11.5">proves the fix holds</text>

  <!-- card C: detection -->
  <rect class="cardbg" fill="#ffffff" stroke="#d0d7de" x="616" y="214" width="243" height="138" rx="12"/>
  <circle cx="650" cy="244" r="4" fill="#3b82f6"/>
  <text class="cvs2" fill="#6e7781" x="664" y="248" font-size="11" font-weight="700" letter-spacing="0.6">DETECTION</text>
  <text class="body mono" fill="#24292f" x="646" y="276" font-size="13">detection/*.yml</text>
  <rect x="646" y="290" width="66" height="25" rx="12" fill="#3b82f6"/>
  <text x="679" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">FIRES</text>
  <text class="mut" fill="#6e7781" x="646" y="336" font-size="11.5">quiet on normal traffic</text>

  <!-- corroboration band -->
  <rect class="band" fill="#f6f8fa" stroke="#d0d7de" x="70" y="378" width="789" height="54" rx="10"/>
  <text class="body" fill="#24292f" x="88" y="401" font-size="14" font-weight="700">All three must corroborate &#8212; or the lab isn&#8217;t done.</text>
  <text class="mut" fill="#6e7781" x="88" y="421" font-size="11">exploit succeeds on the vulnerable build &#183; blocked on secure &#183; detection fires, yet stays quiet on normal traffic</text>

  <!-- closed-loop back arrow -->
  <path d="M70,405 C34,405 34,130 334,130" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text class="cvs2" fill="#6e7781" font-size="10.5" font-weight="600" transform="translate(26,352) rotate(-90)">closed loop &#8212; iterate until all three agree</text>

  <!-- down arrow to analysis -->
  <path d="M464,432 L464,452" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- analysis node -->
  <rect class="cardbg" fill="#ffffff" stroke="#d0d7de" x="70" y="456" width="789" height="82" rx="12"/>
  <circle cx="92" cy="484" r="4" fill="#8b5cf6"/>
  <text class="cvs2" fill="#6e7781" x="106" y="488" font-size="11" font-weight="700" letter-spacing="0.6">ANALYSIS &#183; writeup.md</text>
  <text class="body" fill="#24292f" x="86" y="512" font-size="13.5">Root cause &amp; why the fix works &#8212; the reflective lens that ties red and blue together.</text>
  <text class="mut" fill="#6e7781" x="86" y="530" font-size="11">documents why common wrong fixes fail, and what the defense-in-depth layer actually buys.</text>
</svg>