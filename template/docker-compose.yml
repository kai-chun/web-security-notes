services:
  vuln-py:
    build: ./vulnerable_app/python
    ports: ["8001:5000"]
    profiles: ["py"]

  vuln-go:
    build: ./vulnerable_app/go
    ports: ["8002:5000"]
    profiles: ["go"]

  secure-py:
    build: ./secure_app/python
    ports: ["8003:5000"]
    profiles: ["py"]

  secure-go:
    build: ./secure_app/go
    ports: ["8004:5000"]
    profiles: ["go"]

  # add a `db:` service with `profiles: ["py","go"]` if the lab needs an external DB
  # exploits/ are run as one-off scripts (python exploits/python/exploit.py),
  # not as compose services.

# usage:
#   docker compose --profile py up
#   docker compose --profile go up
#   docker compose --profile py --profile go up
