services:
  vuln-py:
    build:
      context: ./vulnerable_app/python
      dockerfile: ../../python.Dockerfile
    ports: ["8001:5000"]
    profiles: ["py"]

  vuln-go:
    build:
      context: ./vulnerable_app/go
      dockerfile: ../../go.Dockerfile
    ports: ["8002:5000"]
    profiles: ["go"]

  secure-py:
    build:
      context: ./secure_app/python
      dockerfile: ../../python.Dockerfile
    ports: ["8003:5000"]
    profiles: ["py"]

  secure-go:
    build:
      context: ./secure_app/go
      dockerfile: ../../go.Dockerfile
    ports: ["8004:5000"]
    profiles: ["go"]

# usage:
#   docker compose --profile py up         # python stack only
#   docker compose --profile go up         # go stack only
#   docker compose --profile py --profile go up   # both, side-by-side
