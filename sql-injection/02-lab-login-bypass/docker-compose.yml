services:
  vuln-py:
    build: ./vulnerable_app/python
    ports: ["8001:5000"]
    profiles: ["py"]

  vuln-go:
    build: ./vulnerable_app/go
    ports: ["8002:5000"]
    profiles: ["go"]

  # uncomment once secure_app/{python,go} are written
  # secure-py:
  #   build: ./secure_app/python
  #   ports: ["8003:5000"]
  #   profiles: ["py"]
  # secure-go:
  #   build: ./secure_app/go
  #   ports: ["8004:5000"]
  #   profiles: ["go"]

# usage:
#   docker compose --profile py up         # python stack only
#   docker compose --profile go up         # go stack only
#   docker compose --profile py --profile go up   # both, side-by-side
